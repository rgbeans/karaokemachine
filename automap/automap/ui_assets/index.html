<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaraokeMachine · Autogenerator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="next" class="next" title="Skip this candidate and move to the next song (N)">NEXT</button>

  <main class="layout">
    <aside class="side">
      <button id="down" class="thumb down" aria-label="Bad map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
        <span>BAD</span>
      </button>
    </aside>

    <section class="stage">
      <header class="stage-head">
        <div class="identity">
          <div class="eyebrow" id="queue">AUTOGENERATED MAP</div>
          <h1 id="title">Loading…</h1>
          <p id="artist"></p>
        </div>
        <div class="meta" id="meta"></div>
      </header>

      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div class="loading" id="loading" hidden>
          <span class="spinner"></span>
          <span id="loading-text">Reinforcing and generating the next map…</span>
        </div>
      </div>

      <footer class="transport">
        <button id="play" class="play">PLAY</button>
        <div class="time" id="time">0:00 / 0:00</div>
        <input id="seek" class="seek" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Song position">
        <div class="toggles">
          <button id="vocalsToggle" class="toggle on" aria-pressed="true">VOCALS ON</button>
          <button id="backingToggle" class="toggle on" aria-pressed="true">BACKING ON</button>
        </div>
        <div class="status" id="status">Loading candidate…</div>
      </footer>
    </section>

    <aside class="side">
      <button id="up" class="thumb up" aria-label="Good map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        <span>GOOD</span>
      </button>
    </aside>
  </main>

  <audio id="vocals" preload="auto"></audio>
  <audio id="backing" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
